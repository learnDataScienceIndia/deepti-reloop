<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloop Recycling - Digital Business Card</title>
<style>
  :root {
    --green:#258b52;
    --dark:#173b69;
    --text:#333;
    --line:#d7d7d7;
    --soft:#f7f8f8;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    padding:30px;
    background:#eef1f2;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
  }
  .toolbar {
    max-width:1100px;
    margin:0 auto 18px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button {
    border:0;
    border-radius:7px;
    padding:10px 16px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    background:var(--dark);
    color:#fff;
  }
  button.green { background:var(--green); }
  button.gray { background:#666; }
  .hint {
    max-width:1100px;
    margin:0 auto 12px;
    text-align:center;
    font-size:13px;
    color:#666;
  }

  /* Horizontal card */
  .card {
    width:1050px;
    max-width:100%;
    min-height:550px;
    margin:0 auto;
    background:#fff;
    border:1px solid #d5d5d5;
    border-radius:4px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    overflow:hidden;
  }
  .top {
    display:grid;
    grid-template-columns:205px 1fr 245px;
    gap:20px;
    padding:25px 28px 20px;
    min-height:295px;
    align-items:center;
  }
  .person-box {
    text-align:center;
    border-right:1px solid #cfcfcf;
    padding-right:20px;
  }
  .person-photo {
    width:165px;
    height:165px;
    object-fit:cover;
    display:block;
    margin:0 auto 20px;
  }
  .socials {
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .social {
    width:24px;
    height:24px;
    border-radius:6px;
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
  }
  .linkedin { background:#1684b5; }
  .instagram { background:#8c43bd; }
  .whatsapp { background:#2bbd61; }

  .details { padding-left:0; }
  .name {
    margin:0 0 2px;
    color:var(--dark);
    font-size:34px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:.2px;
  }
  .role {
    margin:0 0 25px;
    color:var(--green);
    font-size:20px;
  }
  .contact-row {
    display:flex;
    align-items:center;
    gap:12px;
    margin:10px 0;
    font-size:17px;
  }
  .contact-icon {
    width:32px;
    height:32px;
    border-radius:2px;
    background:var(--dark);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:17px;
    flex:none;
  }
  .website { color:var(--green); font-weight:700; }

  .brand {
    text-align:center;
  }
  .brand img {
    width:225px;
    max-width:100%;
    height:auto;
    object-fit:contain;
  }

  .divider {
    height:1px;
    background:var(--green);
    margin:0 22px;
  }
  .bottom {
    display:grid;
    grid-template-columns:1fr 1fr 1.2fr;
    gap:24px;
    padding:25px 28px 24px;
    align-items:center;
  }
  .office {
    display:grid;
    grid-template-columns:52px 1fr;
    gap:10px;
    align-items:start;
  }
  .flag {
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:50%;
  }
  .office h3 {
    margin:0 0 5px;
    color:var(--green);
    font-size:17px;
  }
  .office strong {
    display:block;
    margin-bottom:4px;
    font-size:14px;
  }
  .office p {
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:#555;
  }
  .certs {
    text-align:right;
  }
  .certs img {
    width:285px;
    max-width:100%;
    height:auto;
    border:1px solid #ccc;
  }

  [contenteditable="true"] {
    outline:none;
    border-radius:3px;
  }
  [contenteditable="true"]:focus {
    box-shadow:0 0 0 2px rgba(37,139,82,.18);
    background:#fbfffc;
  }

  /* Vertical card */
  .card.vertical {
    width:560px;
    min-height:900px;
  }
  .vertical .top {
    grid-template-columns:1fr;
    text-align:center;
    padding:35px 30px 25px;
    min-height:auto;
  }
  .vertical .person-box {
    border-right:0;
    border-bottom:1px solid #cfcfcf;
    padding:0 0 22px;
  }
  .vertical .details {
    padding:5px 0 0;
  }
  .vertical .name { font-size:31px; }
  .vertical .contact-row { justify-content:center; }
  .vertical .brand { order:-1; margin-bottom:12px; }
  .vertical .brand img { width:240px; }
  .vertical .bottom {
    grid-template-columns:1fr;
    gap:22px;
    padding:25px 35px 30px;
  }
  .vertical .certs { text-align:center; }
  .vertical .certs img { width:100%; max-width:340px; }

  .export-mode .toolbar,
  .export-mode .hint { display:none !important; }
  .export-mode { background:#fff; padding:0; }
  .export-mode .card { box-shadow:none; border:0; }

  @media(max-width:800px) {
    body { padding:10px; }
    .card { width:100%; }
    .top { grid-template-columns:1fr; text-align:center; }
    .person-box { border-right:0; border-bottom:1px solid #ccc; padding:0 0 20px; }
    .contact-row { justify-content:center; }
    .bottom { grid-template-columns:1fr; }
    .certs { text-align:center; }
  }

  /* Mobile-first vertical ID-card design */
  html, body {
    width:100%;
    min-height:100%;
  }
  body {
    padding:12px;
    background:#eef1f2;
    overflow-x:hidden;
  }
  .toolbar {
    width:100%;
    max-width:430px;
    margin:0 auto 10px;
  }
  .toolbar button {
    width:100%;
    min-height:46px;
    font-size:15px;
    border-radius:10px;
  }
  .toolbar button:not(.green) { display:none; }
  .hint {
    max-width:430px;
    margin:0 auto 10px;
    font-size:12px;
    line-height:1.35;
  }
  .card,
  .card.vertical {
    width:min(100%, 430px);
    min-height:0;
    margin:0 auto;
    border-radius:18px;
    border:1px solid #d9dfe1;
    box-shadow:0 8px 28px rgba(0,0,0,.14);
    overflow:hidden;
  }
  .card {
    display:block;
  }
  .card .top {
    display:flex;
    flex-direction:column;
    text-align:center;
    padding:22px 20px 18px;
    min-height:0;
    gap:0;
  }
  .vertical .top {
    display:flex;
    flex-direction:column;
    text-align:center;
    padding:22px 20px 18px;
    min-height:0;
  }
  .vertical .brand {
    order:-2;
    margin:0 0 16px;
  }
  .vertical .brand img,
  .brand img {
    width:185px;
    max-width:70%;
  }
  .vertical .person-box {
    border:0;
    border-bottom:1px solid #dfe4e5;
    padding:0 0 16px;
    width:100%;
  }
  .person-photo {
    width:138px;
    height:138px;
    margin:0 auto 13px;
    border-radius:12px;
  }
  .socials { gap:9px; }
  .social {
    width:26px;
    height:26px;
    border-radius:7px;
  }
  .vertical .details,
  .details {
    width:100%;
    padding:15px 0 0;
  }
  .vertical .name,
  .name {
    font-size:clamp(25px, 7vw, 31px);
    line-height:1.05;
    margin:0 0 5px;
    overflow-wrap:anywhere;
  }
  .vertical .role,
  .role {
    font-size:16px;
    margin:0 0 14px;
  }
  .vertical .contact-row,
  .contact-row {
    justify-content:flex-start;
    text-align:left;
    gap:9px;
    margin:8px 0;
    font-size:14px;
    min-width:0;
  }
  .contact-row > span:last-child {
    overflow-wrap:anywhere;
  }
  .contact-icon {
    width:30px;
    height:30px;
    font-size:15px;
    border-radius:7px;
  }
  .divider {
    margin:0 18px;
  }
  .vertical .bottom,
  .bottom {
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:18px 20px 20px;
    align-items:stretch;
  }
  .office {
    grid-template-columns:42px 1fr;
    gap:10px;
  }
  .flag {
    width:42px;
    height:42px;
  }
  .office h3 { font-size:15px; }
  .office strong, .office p { font-size:12px; }
  .vertical .certs,
  .certs { text-align:center; }
  .vertical .certs img,
  .certs img {
    width:100%;
    max-width:290px;
    border-radius:8px;
  }
  .export-mode .card,
  .export-mode .card.vertical {
    width:430px;
    max-width:none;
    border-radius:0;
  }
  @media (max-width:380px) {
    body { padding:8px; }
    .vertical .top { padding:18px 15px 15px; }
    .person-photo { width:122px; height:122px; }
    .vertical .bottom { padding:16px 15px 18px; }
  }

</style>
</head>

<script>
function setOrientation(type) {
  const card = document.getElementById('card');
  card.classList.toggle('vertical', type === 'vertical');
}

async function saveImage() {
  if (typeof html2canvas === 'undefined') {
    alert('Please wait a moment for the image tool to load, then try again.');
    return;
  }

  const card = document.getElementById('card');
  document.body.classList.add('export-mode');

  try {
    const canvas = await html2canvas(card, {
      scale: 3,
      backgroundColor: '#ffffff',
      useCORS: true,
      allowTaint: false
    });

    const link = document.createElement('a');
    const name = document.querySelector('.name').innerText.trim()
      .replace(/[^a-z0-9]+/gi, '-')
      .replace(/^-|-$/g, '') || 'reloop-business-card';

    link.download = name + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('Could not save the image. Please try again after refreshing the page.');
    console.error(e);
  } finally {
    document.body.classList.remove('export-mode');
  }
}
</script>
